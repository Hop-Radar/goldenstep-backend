server {
  listen 80;
  server_name www.goldenstep.site;
  return 301 https://www.goldenstep.site$request_uri;
}

server {
  listen 443 ssl;
  server_name www.goldenstep.site;
  ssl_certificate /etc/letsencrypt/live/www.goldenstep.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.goldenstep.site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
