spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always

goldenstep:
  snapshot:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5500}
  cookie:
    secure: false

  search:
    cleanup:
      enabled: true

  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

naver:
  api-hub:
    client-id: ${NAVER_API_HUB_CLIENT_ID}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET}

  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET}