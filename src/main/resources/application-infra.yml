spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never

goldenstep:
  snapshot:
    frontend-base-url: ${FRONTEND_BASE_URL:https://www.goldenstep.site}
  cookie:
    secure: true

  search:
    cleanup:
      enabled: true

  ai:
    base-url: ${AI_BASE_URL}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

naver:
  api-hub:
    client-id: ${NAVER_API_HUB_CLIENT_ID}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET}

  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET}