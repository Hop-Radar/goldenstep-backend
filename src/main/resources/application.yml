spring:
  application:
    name: goldenstep

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

goldenstep:
  cookie:
    secure: false

  search:
    cleanup:
      initial-delay-ms: 60000
      fixed-delay-ms: 60000

naver:
  api-hub:
    client-id: ${NAVER_API_HUB_CLIENT_ID}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET}

  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET}