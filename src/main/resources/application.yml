spring:
  application:
    name: goldenstep

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local,mock}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

goldenstep:
  search:
    cleanup:
      initial-delay-ms: 60000
      fixed-delay-ms: 60000
  health:
    connect-timeout-ms: ${HEALTH_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${HEALTH_READ_TIMEOUT_MS:3000}